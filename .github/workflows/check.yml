name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    # GitHub-hosted: this repository is public, so pull requests from forks stay off our own runners.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Manifests are valid JSON and agree on each plugin's version
        run: python3 scripts/check_manifests.py
      - name: Canvas tests
        run: |
          npm install --global @anthropic-ai/claude-code
          claude plugin test plugins/alchemist-canvas
